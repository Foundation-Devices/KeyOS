[package]
name = "qbsdiff"
version = "1.4.4"
authors = ["hucsmn <hucsmn@hotmail.com>"]
edition = "2021"
license = "MIT"
readme = "README.md"
keywords = ["bsdiff", "delta"]
homepage = "https://github.com/hucsmn/qbsdiff"
repository = "https://github.com/hucsmn/qbsdiff"
description = "Fast and memory saving bsdiff 4.x compatible delta compressor and patcher."

[dependencies]
byteorder = "1.5"
bzip2 = { version = "0.6.0", optional = true }
ruzstd = { git = "https://github.com/Foundation-Devices/zstd-rs.git", tag = "v0.9.1-foundation1", optional = true }
libzstd = { package = "zstd", version = "0.13", optional = true }
rayon = { version = "1.10", optional = true }
suffix_array = { version = "0.5", optional = true }

[dev-dependencies]
chrono = "0.4.20"
globwalk = "0.9"
rand = "0.9"

[features]
default = ["bzip2"]
# Read and write BSDIFF40 patches.
bzip2 = ["dep:bzip2", "encode"]
# Read BSDIFF4Z patches. Pure Rust, so it builds for the device.
zstd = ["dep:ruzstd"]
# Write BSDIFF4Z patches. Pulls in libzstd, so host only.
zstd-encode = ["dep:libzstd", "encode", "zstd"]
# Building patches at all. The suffix array search is useless to a device that
# only applies them.
encode = ["dep:rayon", "dep:suffix_array"]
