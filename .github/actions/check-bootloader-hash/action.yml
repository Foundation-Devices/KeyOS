name: Check bootloader hash
description: Verify the bootloader matches its tracked version and hash

inputs:
  base-ref:
    description: Commit to use as the bootloader baseline
    required: true
runs:
  using: composite
  steps:
    - name: Record runner environment
      shell: bash
      run: bash "${{ github.action_path }}/../../../scripts/ci-runner-diagnostics.sh"

    - name: Build and verify the bootloader
      shell: bash
      env:
        BASE_REF: ${{ inputs.base-ref }}
      run: nix develop .#build --command cargo xtask check-bootloader-hash --base-ref "$BASE_REF"
