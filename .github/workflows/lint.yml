name: Lint
on: 
  workflow_call:
env:
  GH_TOKEN: ${{ secrets.GH_TOKEN }}
jobs:
  allowed-publisher-copy:
    name: No trusted-publisher user-facing copy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Reject legacy trusted-publisher wording
        run: |
          if git grep -nEi \
            'trust(ed| this)?[ _-]*publishers?|publisher[ _-]+trust' -- \
            'ui/ui/i18n/sources' \
            ':(glob)apps/**/i18n/*.json' \
            ':(glob)apps/**/*.slint' \
            ':(glob)os/**/i18n/*.json' \
            ':(glob)os/**/*.slint' \
            ':(glob)ui/ui/**/*.slint' \
            'sdk/crates/cli/src' \
            'sdk/crates/cli/templates' \
            'sdk/docs' \
            'utils/passport-drive/src' \
            'utils/passport-drive/README.md' \
            'os/app-manager/README.md' \
            'os/app-manager/THIRD_PARTY_CERTIFICATE_FORMAT.md'; then
            echo 'Use "allowed publisher" in user-facing copy.'
            exit 1
          fi

  reuse:
    name: Is compliant (reuse)?
    runs-on: ubuntu-latest
    steps:
       - uses: actions/checkout@v3
       - uses: ./.github/actions/setup-nix
         with:
           use-cache: 'false'
       - run: nix run .#reuse -- --version
       - run: nix run .#reuse -- lint

  format-rust:
    name: Check Rust formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: ./.github/actions/setup-nix
        with:
          use-cache: 'false'
      
      - run: nix shell .#rust-keyos --command cargo fmt --all -- --check
      # sdk/ is a separate workspace, so the root --all above does not reach it.
      - run: nix shell .#rust-keyos --command cargo fmt --manifest-path sdk/Cargo.toml --all -- --check
      - run: nix shell .#rust-keyos --command cargo fmt --manifest-path sdk/crates/cli/Cargo.toml --all -- --check

  format-slint:
    name: Check Slint formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: ./.github/actions/setup-nix
        with:
          use-cache: 'false'
           
      - run: nix shell .#slint-lsp-upstream --command ./scripts/format-slint.sh --check

  format-toml:
    name: Check TOML formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: ./.github/actions/setup-nix
        with:
          use-cache: 'false'
      - run: nix shell .#taplo .#just --command just toml-fmt --check

  format-nix:
    name: Check Nix formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: ./.github/actions/setup-nix
        with:
          use-cache: 'false'
      - run: nix fmt -- . --check
