name: Bootloader hash

on:
  merge_group:
  pull_request:

concurrency:
  group: bootloader-hash-${{ github.event.pull_request.number || github.event.merge_group.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Require version update for bootloader changes
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-nix-rust
        with:
          rust-cache-key: bootloader-hash
          setup-git-auth: 'false'
      - uses: ./.github/actions/check-bootloader-hash
        with:
          base-ref: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
