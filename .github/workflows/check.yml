name: Check
on: 
  workflow_call:
env:
  GH_TOKEN: ${{ secrets.GH_TOKEN }}
jobs:
  check-atsama5d27:
    name: Check atsama5d27 compilation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: ./.github/actions/setup-nix-rust
      
      - run: nix develop .#build --command cargo check --target armv7a-none-eabi --package atsama5d27

  check-workspace:
    name: Check workspace compilation
    runs-on: [ self-hosted, Linux ]
    steps:
      - uses: actions/checkout@v3
      - uses: ./.github/actions/setup-nix-rust
      
      - run: |
          nix develop .#build --command just check-workspace

  check-recovery:
    name: Check recovery compilation
    runs-on: [ self-hosted, Linux ]
    steps:
      - uses: actions/checkout@v3
      - uses: ./.github/actions/setup-nix-rust

      - run: |
          nix develop .#build --command just check-recovery

  test-sdk:
    name: Test SDK workspaces
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: ./.github/actions/setup-nix-rust
        with:
          rust-cache-key: sdk
          rust-cache-workspaces: |
            sdk -> target
            sdk/crates/cli -> target

      # The SDK is a self-contained Nix-first tree; enter its own maintainer
      # flake (sdk/flake.nix) rather than the parent workspace shell.
      - name: Test foundation CLI workspace
        working-directory: sdk
        run: nix develop --command cargo test --manifest-path crates/cli/Cargo.toml --workspace
      - name: Test experimental plugin implementation
        working-directory: sdk
        run: >-
          nix develop --command cargo test --manifest-path crates/cli/Cargo.toml
          --package foundation --features experimental-plugins
      - name: Test SDK xtask workspace
        working-directory: sdk
        run: nix develop --command cargo test --manifest-path Cargo.toml --workspace

  test-sdk-user-environment:
    name: Test SDK user environment
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: ./.github/actions/setup-nix-rust

      # `foundation develop` copies the user flake into a scratch directory and
      # enters it. Probe that exact shell with the real toolchain (no fakes) so
      # toolchain regressions (pinned channel drift, custom target gates) fail
      # here instead of on SDK users' machines.
      - name: Stage the SDK user flake
        run: |
          mkdir -p "$RUNNER_TEMP/sdk-user-flake"
          cp sdk/nix/sdk-user-flake.nix "$RUNNER_TEMP/sdk-user-flake/flake.nix"
          cp sdk/nix/sdk-user-flake.lock "$RUNNER_TEMP/sdk-user-flake/flake.lock"

      # A compile failure leaves doctor.log without the expected lines, so the
      # greps below also cover "the CLI builds inside the user shell".
      - name: Run foundation doctor in the user shell
        run: |
          export FOUNDATION_SDK_ROOT="$PWD/sdk"
          nix develop "path:$RUNNER_TEMP/sdk-user-flake" --no-write-lock-file --command \
            cargo run --manifest-path sdk/crates/cli/Cargo.toml --package foundation -- doctor \
            | tee doctor.log || true
          # foundation-slint-viewer and foundation-asset-tool only exist in a
          # packaged SDK bundle, so doctor cannot go fully green from a bare
          # checkout and its exit status is masked. Assert the two things only
          # the user shell provides: the custom KeyOS target and ARM binutils.
          grep -F 'Checking KeyOS target: armv7a-unknown-xous-elf' doctor.log
          grep -F 'Checking arm-none-eabi-strip: OK' doctor.log
