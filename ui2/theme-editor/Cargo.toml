[package]
name = "theme-editor"
version = "0.1.0"
edition = "2021"

[dependencies]
slint = { workspace = true, features = ["compat-1-2", "unstable-winit-030", "renderer-software"] }
components = { path = "../components" }
rfd = "0.15"  # File dialogs
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
dirs = "5.0"  # For ~/.foundation path

[build-dependencies]
serde_json = "1.0"
slint-build = "1.9"
