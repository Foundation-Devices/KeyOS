[package]
name = "update-image"
version = "0.1.0"
edition = "2021"

[dependencies]
bzip2 = { workspace = true, optional = true }
qbsdiff = { workspace = true, default-features = false, features = ["zstd"] }
serde = { version = "1.0.210", features = ["derive"] }
sha2 = { workspace = true, optional = true }

[features]
default = []
# Build patches as well as apply them. Pulls in libzstd, so host only.
build = ["dep:bzip2", "dep:sha2", "qbsdiff/bzip2", "qbsdiff/zstd-encode"]
