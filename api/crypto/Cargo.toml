[package]
name = "crypto"
version = "1.0.0"
edition = "2021"
description = "Hardware-acclerated cryptography API crate"
publish = false

[dependencies]
log = { workspace = true }
num-derive = { workspace = true }
num-traits = { workspace = true }
rkyv = { workspace = true }
server = { workspace = true }
sha2 = { version = "0.10", features = ["compress"] }
thiserror = "1.0"
xous = { workspace = true }
zeroize = { version = "1.8.1", default-features = false, features = ["zeroize_derive"] }

[target.'cfg(keyos)'.dependencies]

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(keyos)'] }
