# The emulator's child-facing syscall channel: internal plumbing between a Flux child and its
# emulator, not a user-facing permission, so it carries no permissionGroup and never shows in
# Settings. Ungrouped messages default to Foundation-only, which is the point: the channel
# reaches seed-derived key material, so only Foundation-signed children may hold it.
[servers."os/gui-app-emu-flux"]
SendSeph = { id = 1, type = "archive" }
RecvSeph = { id = 2, type = "blockingArchive" }
SyscallBuffer = { id = 3, type = "lendMut" }
