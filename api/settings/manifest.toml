manifestVersion = "0"
[servers."os/settings"]
# `settings.ui-essentials`: presentation and localization state any UI app needs to
# render consistently with the system (theme, accent, locale, time). Third-party readable.
# `settings.device-configuration`: the rest (onboarding, security words, radios,
# developer mode, calibration). Foundation-only reads.
