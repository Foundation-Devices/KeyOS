[package]
name = "app-archive"
version = "0.1.0"
edition = "2021"

[dependencies]
flate2 = { version = "1.1", optional = true }
tar = { workspace = true, optional = true }
thiserror = { workspace = true, optional = true }

[dev-dependencies]
flate2 = "1.1"
tar = { workspace = true }
tempfile = "3"

[features]
default = []
# Building an archive from a staged bundle directory. Host-only: it reads the bundle through
# `std::fs`, which on device is the `fs` service instead.
pack = ["dep:flate2", "dep:tar", "dep:thiserror"]
# Reading an archive: gzip detection and the entry checks a reader applies before it trusts
# anything. The caller keeps its own I/O, so this pulls in no tar dependency.
unpack = ["dep:flate2", "dep:thiserror"]
