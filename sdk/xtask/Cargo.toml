[package]
name = "xtask"
edition.workspace = true
license.workspace = true
version.workspace = true

[[bin]]
name = "xtask"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

[dev-dependencies]
tempfile = "3"
