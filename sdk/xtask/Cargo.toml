[package]
name = "xtask"
edition.workspace = true
license.workspace = true
version.workspace = true

[[bin]]
name = "xtask"
path = "src/main.rs"

[dependencies]
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
toml = "0.8"
zip = { version = "2.4.2", default-features = false }
