[package]
name = "foundation-themes"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[workspace]

[lib]
name = "foundation_themes"
path = "src/lib.rs"

# Host-side codegen tool. The `foundation` CLI shells out to this (rather than
# linking foundation-themes -> components -> slint into the lean host CLI) to
# turn theme JSON into Rust under ~/.foundation/themes/rust.
[[bin]]
name = "foundation-theme-compiler"
path = "src/bin/theme_compiler.rs"

[dependencies]
anyhow = "1"
components = { path = "../../../ui2/components" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
