[package]
name = "{{app_name}}"
version = "{{version}}"
edition = "2021"

[workspace]

[dependencies]
log = "0.4"
log-server = { package = "xous-api-log", path = "{{sdk_keyos_root}}/xous/api/log" }
server = { path = "{{sdk_keyos_root}}/server" }
slint-keyos-platform = { path = "{{sdk_keyos_root}}/slint-keyos-platform/runtime" }
foundation-themes = { path = "{{sdk_keyos_root}}/sdk/crates/foundation-themes" }

[build-dependencies]
slint-keyos-platform-build = { path = "{{sdk_keyos_root}}/slint-keyos-platform/build" }
