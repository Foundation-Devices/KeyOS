[workspace]
members = [
    "crates/foundation-core",
    "crates/foundation-ui",
    "crates/foundation-plugins",
    "crates/foundation-plugin-sdk",
    "crates/foundation-mcp",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Foundation Devices <team@foundation.xyz>"]
license = "MIT"

[workspace.dependencies]
# CLI
clap = { version = "4", features = ["derive"] }
clap_complete = "4"

# Async
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"

# HTTP (using rustls to avoid macOS native-tls OCSP delays)
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

# Terminal UI
indicatif = "0.17"
console = "0.15"
dialoguer = "0.11"

# Utilities
anyhow = "1"
thiserror = "1"
dirs = "5"
semver = { version = "1", features = ["serde"] }
once_cell = "1"

# Internal crates
foundation-core = { path = "crates/foundation-core" }
foundation-ui = { path = "crates/foundation-ui" }
foundation-plugins = { path = "crates/foundation-plugins" }
foundation-plugin-sdk = { path = "crates/foundation-plugin-sdk" }
foundation-mcp = { path = "crates/foundation-mcp" }

[package]
name = "foundation"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Foundation CLI for KeyOS app development"

[[bin]]
name = "foundation"
path = "src/main.rs"

[dependencies]
# Internal dependencies
foundation-core = { workspace = true }
foundation-ui = { workspace = true }
foundation-plugins = { workspace = true }
foundation-plugin-sdk = { workspace = true }
foundation-mcp = { workspace = true }

# External dependencies
clap = { workspace = true }
clap_complete = { workspace = true }
tokio = { workspace = true }
anyhow = { workspace = true }
once_cell = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
dialoguer = { workspace = true }
dirs = { workspace = true }
semver = { workspace = true }
app-archive = { path = "../../../app-archive", features = ["pack"] }
cosign2 = { path = "../../../imports/cosign2/cosign2" }
hex = "0.4"
publisher-fingerprint = { path = "../../../utils/publisher-fingerprint" }
secp256k1 = "0.29"
sha2 = "0.10"
include_dir = "0.7"
tempfile = "3"

[profile.release]
strip = true
lto = true
codegen-units = 1
opt-level = "z"
