[sdk]
version = "1.0.0"
api_version = "1"
# KeyOS API release documented by this SDK. This is independent of the SDK
# package version and must use RecoveryOS-compatible SemVer (for example,
# `beta3`, not `beta.3`).
keyos_version = "1.4.0-beta3"

# The public Rust crates copied into the SDK and included in the generated API
# reference. This is the only allowlist for the SDK API surface.
[[sdk.api_crates]]
package = "server"
crate_name = "server"
workspace = "keyos"
source = "../server"
dest = "lib/keyos/server"
description = "Type-safe server traits, checked connections, and IPC helpers."

[[sdk.api_crates]]
package = "app-manager"
crate_name = "app_manager"
workspace = "keyos"
source = "../api/app-manager"
dest = "lib/keyos/api/app-manager"
description = "App launch, app metadata, QR acceptance criteria, and third-party certificates."
permission_manifest = "api/app-manager/manifest.toml"

[[sdk.api_crates]]
package = "backup"
crate_name = "backup"
workspace = "keyos"
source = "../api/backup"
dest = "lib/keyos/api/backup"
description = "Backup and restore operations."
permission_manifest = "api/backup/manifest.toml"

[[sdk.api_crates]]
package = "camera"
crate_name = "camera"
workspace = "keyos"
source = "../api/camera"
dest = "lib/keyos/api/camera"
description = "Camera frame subscription and camera configuration."
permission_manifest = "api/camera/manifest.toml"

[[sdk.api_crates]]
package = "crypto"
crate_name = "crypto"
workspace = "keyos"
source = "../api/crypto"
dest = "lib/keyos/api/crypto"
description = "Cryptographic server APIs."
permission_manifest = "api/crypto/manifest.toml"

[[sdk.api_crates]]
package = "fs"
crate_name = "fs"
workspace = "keyos"
source = "../api/fs"
dest = "lib/keyos/api/fs"
description = "Filesystem handles, directories, metadata, and mapped files."
permission_manifest = "api/fs/manifest.toml"

[[sdk.api_crates]]
package = "gui-server-api"
crate_name = "gui_server_api"
workspace = "keyos"
source = "../api/gui-server"
dest = "lib/keyos/api/gui-server"
description = "Rust API crate for the os/gui-server service."
permission_manifest = "api/gui-server/manifest.toml"

[[sdk.api_crates]]
package = "haptics"
crate_name = "haptics"
workspace = "keyos"
source = "../api/haptics"
dest = "lib/keyos/api/haptics"
description = "Haptic patterns and playback control."
permission_manifest = "api/haptics/manifest.toml"

[[sdk.api_crates]]
package = "nfc"
crate_name = "nfc"
workspace = "keyos"
source = "../api/nfc"
dest = "lib/keyos/api/nfc"
description = "NFC operations."
permission_manifest = "api/nfc/manifest.toml"

[[sdk.api_crates]]
package = "quantum-link"
crate_name = "quantum_link"
workspace = "keyos"
source = "../api/quantum-link"
dest = "lib/keyos/api/quantum-link"
description = "QuantumLink state, firmware fetch, pairing, PSBT, and account-sync helpers."
permission_manifest = "api/quantum-link/manifest.toml"
# The SDK builder stages a temporary error-only `bt` compatibility crate for
# this package. The real Bluetooth API is neither copied nor documented.

[[sdk.api_crates]]
package = "rgb-led"
crate_name = "rgb_led"
workspace = "keyos"
source = "../api/rgb-led"
dest = "lib/keyos/api/rgb-led"
description = "RGB LED color and animation control."
permission_manifest = "api/rgb-led/manifest.toml"

[[sdk.api_crates]]
package = "security"
crate_name = "security"
workspace = "keyos"
source = "../api/security"
dest = "lib/keyos/api/security"
description = "Authentication, seeds, keys, and device security state."
permission_manifest = "api/security/manifest.toml"

[[sdk.api_crates]]
package = "settings"
crate_name = "settings"
workspace = "keyos"
source = "../api/settings"
dest = "lib/keyos/api/settings"
description = "Typed settings get, set, and subscribe APIs."
permission_manifest = "api/settings/manifest.toml"

[[sdk.api_crates]]
package = "foundation-manifest"
crate_name = "foundation_manifest"
workspace = "sdk"
source = "crates/manifest"
description = "Parse and inspect KeyOS application manifests."

[submodules.slint]
path = "external/slint"
repo = "git@github.com:Foundation-Devices/slint.git"
ref = "v1.17.0-foundation2"
source_hash = "sha256-+eriY9l5KFrJFVau27mScWvMemPFx6op5iSI5MvMWBE="
env_override = "SLINT_DIR"

[targets]
triples = ["aarch64-apple-darwin", "x86_64-apple-darwin", "x86_64-unknown-linux-gnu", "aarch64-unknown-linux-gnu"]

# Keep the public target name for installer compatibility, but use a static
# musl executable so ARM Linux archives do not depend on Nix store paths.
[targets.overrides."aarch64-unknown-linux-gnu"]
cargo_target = "aarch64-unknown-linux-musl"
linker = "aarch64-unknown-linux-musl-gcc"
strip = "aarch64-unknown-linux-musl-strip"

[[compile]]
name = "foundation"
manifest = "crates/cli"
artifact = "foundation"
binary = "foundation"
# Supported SDK bundles must not include the quarantined plugin surface even
# if a default feature is added to the CLI in the future.
cargo_flags = ["--no-default-features"]

[[compile]]
name = "foundation-asset-tool"
manifest = "tools/foundation-asset-tool"
artifact = "foundation-asset-tool"
binary = "foundation-asset-tool"

[[compile]]
name = "fatfs-image"
manifest = "../utils/fatfs-image"
package = "fatfs-image"
artifact = "fatfs-image"
binary = "fatfs-image"

[[compile]]
name = "simulator"
manifest = "../apps/simulator"
package = "simulator"
artifact = "simulator"
binary = "foundation-simulator"

[[compile]]
name = "cosign2"
manifest = "../imports/cosign2/cosign2-bin"
package = "cosign2-bin"
artifact = "cosign2"
binary = "cosign2"

[[compile]]
name = "slint-viewer"
manifest = "external/slint/tools/viewer"
package = "slint-viewer"
artifact = "slint-viewer"
binary = "foundation-slint-viewer"
# Explicit backend selection: the default `backend-default` feature pulls in
# i-slint-backend-qt, whose build script probes the environment for qmake.
# Select i-slint-common too so Cargo can enable its fontconfig-dlopen feature
# for the shared fontique dependency when cross-compiling the viewer.
cargo_flags = [
    "--bin",
    "slint-viewer",
    "-p",
    "i-slint-common",
    "--no-default-features",
    "--features",
    "backend-winit,renderer-femtovg,renderer-software,custom-translations,i-slint-common/fontconfig-dlopen",
]

[[compile]]
name = "keyos-log-viewer"
manifest = "../utils/keyos-log-viewer"
package = "keyos-log-viewer"
artifact = "keyos-log-viewer"
binary = "foundation-keyos-log-viewer"

[[compile]]
name = "passport-drive"
manifest = "../utils/passport-drive"
package = "passport-drive"
artifact = "passport-drive"
binary = "foundation-passport-drive"

[[compile]]
name = "foundation-theme-compiler"
manifest = "crates/foundation-themes"
package = "foundation-themes"
artifact = "foundation-theme-compiler"
binary = "foundation-theme-compiler"

[[compile]]
name = "foundation-theme-editor"
manifest = "../ui2/theme-editor"
package = "theme-editor"
artifact = "theme-editor"
binary = "foundation-theme-editor"

[[copy]]
source = "../i18n"
dest = "lib/keyos/i18n"

[[copy]]
source = "../keyos"
dest = "lib/keyos/keyos"

[[copy]]
source = "../os/app-manifest"
dest = "lib/keyos/os/app-manifest"

[[copy]]
source = "../slint-keyos-platform"
dest = "lib/keyos/slint-keyos-platform"

[[copy]]
source = "../ui2/components"
dest = "lib/keyos/ui2/components"

# Component schemas (button.schema.json, ...) for the per-app theme-compile step:
# `foundation build` generates `<key>_theme.slint` from these + the app theme.
[[copy]]
source = "../ui2/theme-editor/defaults/components"
dest = "lib/keyos/ui2/theme-editor/defaults/components"

[[copy]]
source = "crates/foundation-themes"
dest = "lib/keyos/sdk/crates/foundation-themes"
filter = "cargo_package"

[[copy]]
source = "external/slint"
dest = "lib/slint"
bundle = "common"
filter = "slint_sdk"

[[copy]]
source = "../utils/file-backed"
dest = "lib/keyos/utils/file-backed"

[[copy]]
source = "../utils/fiat-symbols"
dest = "lib/keyos/utils/fiat-symbols"

[[copy]]
source = "../utils/defer"
dest = "lib/keyos/utils/defer"

[[copy]]
source = "../utils/whence"
dest = "lib/keyos/utils/whence"

[[copy]]
source = "../utils/localizer-codegen"
dest = "lib/keyos/utils/localizer-codegen"

[[copy]]
source = "../worker"
dest = "lib/keyos/worker"

[[copy]]
source = "../xous/api"
dest = "lib/keyos/xous/api"

[[copy]]
source = "../xous/xous-rs"
dest = "lib/keyos/xous/xous-rs"

[[copy]]
source = "../imports/getrandom"
dest = "lib/keyos/imports/getrandom"
filter = "cargo_package"

[[copy]]
source = "crates/cli/templates"
dest = "lib/templates"

[[copy]]
source = ".agents"
dest = ".agents"

[[copy]]
source = ".claude"
dest = ".claude"

[[copy]]
source = "examples"
dest = "examples"

[[copy]]
source = "../utils/passport-drive/99-passport.rules"
dest = "share/99-passport.rules"

[docs]
guide_source = "docs"

[signing]
key_env = "FOUNDATION_SIGN_KEY"
