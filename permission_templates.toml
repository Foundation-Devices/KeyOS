[fs-generic]
"os/fs" = [
    "OpenDirMessage",
    "OpenFileMessage",
    "CloseFile",
    "CloseDir",
    "CreateDirMessage",
    "ReadFile",
    "SeekFile",
    "WriteFile",
    "TruncateFile",
    "SetLen",
    "GetMetadata",
    "NextEntry",
    "Flush",
    "Remove",
    "Rename",
    "AtomicCopy",
    "AsyncRead",
    "AsyncWrite",
    "AsyncCopyBlock",
    "SubscribeFilesystemEvent",
]
[i2c]
"os/i2c" = [
    "ClaimPeripheral",
    "SingleTransfer",
]
[gpio]
"os/gpio" = [
    "ClaimPin",
    "EnableIrq",
    "SetPin",
    "GetPin",
]
[gui-app]
"os/fs" = [
    "OpenDirMessage",
    "OpenFileMessage",
    "CloseFile",
    "CloseDir",
    "ReadFile",
    "NextEntry",
    "MapFileMessage",
    "GetMetadata",
]
"os/gui-server" = [
    "RegisterAppMessage",
    "RequestRedraw",
    "AnimateNextFrame",
    "SubmitFrame",
    "UpdateKeyboard",
    "HideKeyboard",
    "ShowModal",
]
"os/settings" = [
    "GetSystemTheme",
    "SubscribeSystemTheme",
    "GetDebugTouch",
    "SubscribeDebugTouch",
]
[navigable]
"os/gui-server" = [
    "GetPendingNavRequest",
    "FinishResponse",
    "NavigationCancel",
]
[crypto-sha]
"os/crypto" = [
    "ShaSetContext",
    "ShaUpdate",
    "ShaGetContext",
    "ShaDrop",
]
[crypto-aes]
"os/crypto" = [
    "AesSetup",
    "AesExecute",
    "AesAad",
    "AesGcmTag",
    "AesClear",
]
[flux-app]
# Headless Flux child apps: the emulator-server syscall channel plus the os/fs
# message subset FileBacked needs to persist each app's own NVM to its AppData.
"os/gui-app-emu-flux" = ["SendSeph", "RecvSeph", "SyscallBuffer"]
"os/fs" = [
    "CreateDirMessage",
    "CloseDir",
    "OpenFileMessage",
    "CloseFile",
    "ReadFile",
    "SeekFile",
    "WriteFile",
    "TruncateFile",
    "Flush",
    "Rename",
    "Remove",
]
