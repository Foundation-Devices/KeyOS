manifestVersion = "0"
appId = "0xbf5cdfbfda7e85b5253ff268d32ea957"
syscall = ["CreateProcess", "GetPanicMessage"]
extends = "../../api/app-manager"

[appName]
en = "App Manager"

[servers."os/app-manager"]
ChildCrashed = { id = 64, type = "scalar" }
Disconnected = { id = 65, type = "scalar" }

[permissions]
template = ["fs-generic", "crypto-sha"]
"os/gui-server" = ["RequestAppClose"]
"os/crypto" = ["ShaSetContext", "ShaUpdate", "ShaGetContext", "ShaDrop"]
"os/fs" = [
    "GetSystemReadAccess",
    "GetSystemWriteAccess",
    "GetSystemAppDataReadAccess",
    "GetSystemAppDataWriteAccess",
    "FlushFs",
    # Read-only, and only where a user can put a file: an app archive is installed from the
    # storage the user picked it on (see InstallAppArchive).
    "GetUserReadAccess",
    "GetUsbReadAccess",
    "GetAirlockReadAccess",
    "Remove",
    "RemoveAppData",
    "RegisterAppResources",
]
"os/nameserver" = ["AddManifest", "RemoveManifest"]
