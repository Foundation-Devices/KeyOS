[package]
name = "usb-debug-protocol"
version = "0.1.0"
edition = "2021"

[features]
default = []
## Build the host-side `UsbDebugClient` transport (depends on rusb + anyhow).
client = ["dep:rusb", "dep:anyhow"]

[dependencies]
anyhow = { workspace = true, optional = true }
num-derive = { workspace = true }
num-traits = { workspace = true }
rusb = { version = "0.9", optional = true }

[target.'cfg(keyos)'.dependencies]
xous = { workspace = true }

[target.'cfg(windows)'.dependencies]
rusb = { version = "0.9", optional = true, features = ["vendored"] }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(keyos)'] }
