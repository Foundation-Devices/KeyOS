[package]
name = "usb-debug"
version = "0.1.0"
edition = "2021"

[features]
default = []
## Set by the build system for production firmware builds.
## Restricts usb-debug protocol commands to the production allow-list.
production = []

[dependencies]
app-manager = { workspace = true }
fs = { workspace = true }
gui-server-api = { workspace = true }
log = { workspace = true }
log-server = { workspace = true }
power-manager = { workspace = true }
rkyv = { workspace = true }
security = { workspace = true }
server = { workspace = true }
settings = { workspace = true }
usb = { workspace = true }
usb-debug-protocol = { workspace = true }
utralib = { workspace = true }
xous = { workspace = true }
xous-ticktimer = { workspace = true }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(keyos)'] }
