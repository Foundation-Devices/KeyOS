manifestVersion = "0"
appId = "0x75736200000000000000000000000000"
memory = ["UDPHS", "UDPHS_RAM", "UHPHS_EHCI"]
syscall = ["ClaimInterrupt", "VirtToPhys", "SetThreadPriority"]
extends = "../../api/usb"

[appName]
en = "USB Server"

[servers."os/usb"]
DoWork = { id = 0, type = "scalar" }
SetEnabled = { id = 6, type = "scalar" }
SubscriberDisconnected = { id = 64, type = "scalar" }

[servers."os/usb-internal"]
StateTimedOut = { id = 0, type = "scalar" }

[servers."os/usbdev"]
SetDeviceEmulationEnabled = { id = 99, type = "scalar" }
EndOfReset = { id = 100, type = "scalar" }
DmaInterrupt = { id = 101, type = "scalar" }
RxCompleteInterrupt = { id = 102, type = "move" }
TxCompleteInterrupt = { id = 103, type = "scalar" }

[permissions]
"os/power-manager" = ["SetPeripheralEnabled"]
"os/power-manager-ext" = ["SetOtgPriority", "StatusSubscribe"]
"os/settings" = [
    "SubscribeDeviceName",
    "SubscribeUsbEnabled",
    "SubscribeAirlockMode",
    "SetAirlockMode",
]
