manifestVersion = "0"
appId = "0x6f732f63727970746f00000000000000"
memory = ["AES", "SHA", "SECURAM"]
syscall = ["VirtToPhysPid", "SetThreadPriority"]
extends = "../../api/crypto"

[appName]
en = "Crypto"

# Kernel-delivered client-disconnect event, used to clear a departed client's AES/SHA contexts.
[servers."os/crypto"]
ClientDisconnected = { id = 64, type = "scalar", cfg = "keyos" }

[permissions]
"os/dma" = [
    "PeripheralTransferMsg",
    "ExecuteTransferMsg",
    "WaitTransferMsg",
    "DropTransferMsg",
    "SubscribeTransferComplete",
]
"os/power-manager" = ["SetPeripheralEnabled"]
