manifestVersion = "0"
appId = "0x6775692d736572766572000000000000"
memory = ["LCDC"]
syscall = ["VirtToPhys", "VirtToPhysPid", "TerminatePid", "ClaimInterrupt", "GetSystemStats", "SetThreadPriority", "ResolveMessagePermission", "GetPermissionRequestData", "SystemEventHandler"]
extends = "../../api/gui-server"

[appName]
en = "GUI Server"

[servers."os/gui-server"]
DisconnectHandlerMessage = { id = 19, type = "scalar" }
OnVsyncMessage = { id = 21, type = "scalar" }
OnFreeMemoryBelowThreshold = { id = 24, type = "scalar" }
CloseAppTimeout = { id = 25, type = "scalar" }
BlurDone = { id = 26, type = "scalar" }
PowerButtonTimerCallback = { id = 42, type = "scalar" }
AutoLockTimerCallback = { id = 43, type = "scalar" }
ForceShutdownTimeout = { id = 50, type = "scalar" }
PermissionRequest = { id = 66, type = "scalar", cfg = 'not(feature = "recovery-os")' }

[permissions]
"template" = ["i2c", "gpio"]
"os/app-manager" = [
    "LaunchApp",
    "LaunchAppBlocking",
    "GetPermissionRequestInfo",
    "SetAppPermissionGrant",
]
"os/bt" = ["Disconnect"]
"os/fs" = ["SubscribeFilesystemEvent"]
"os/camera" = ["NotifyVisible", "Subscribe"]
"os/haptics" = ["Vibrate"]
"os/power-manager" = ["SetPeripheralEnabled", "Reboot"]
"os/power-manager-ext" = ["GetStatus", "Shutdown"]
"os/rgb-server" = ["AnimateAllTo", "SetAllTo", "SubscribeColorUpdates"]
"os/security" = ["Logout", "GetMasterKeyState"]
"os/settings" = [
    "GetAutoLock",
    "SubscribeAutoLock",
    "GetScreenBrightness",
    "SubscribeScreenBrightness",
    "GetTouchOffset",
    "SubscribeTouchOffset",
    "SubscribeDeveloperMode",
    "FlushAll",
    "SubscribeOnboardingStatus",
    "GetPrimeColor",
]
"os/spi" = ["ClaimPeripheral", "SpiXfer"]
