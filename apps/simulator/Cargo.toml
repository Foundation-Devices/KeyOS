[package]
name = "simulator"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1.0"
gui-server-api = { workspace = true }
image = "0.25"
log = "0.4.14"
log-server = { package = "xous-api-log", path = "../../xous/api/log" }
serde = "1.0"
serde_json = "1.0"
server = { path = "../../server" }
settings = { workspace = true }
xous = { workspace = true }

# Host-only desktop tool on the femtovg GPU renderer. Stock crates.io Slint, kept a
# separate package from the firmware's fork so renderer-femtovg can't unify onto the
# device's software-renderer Slint, but pinned to the fork's exact upstream =1.12.1
# so both share one skia-bindings; a different version would link native `skia`
# twice, which Cargo forbids. renderer-software stays on or i-slint-core fails to
# link bytemuck (its Pod derives are gated behind that feature).
[dependencies.slint]
default-features = false
features = ["std", "serde", "backend-winit", "unstable-winit-030", "renderer-femtovg", "renderer-software", "compat-1-2"]
version = "=1.12.1"

[build-dependencies.slint-build]
version = "=1.12.1"
